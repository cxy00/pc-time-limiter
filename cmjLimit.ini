; cmjLimit 默认配置文件
;
; 把这个文件放到以下任一位置即可生效（程序也会在首次运行时自动生成）：
;   当前用户： %LOCALAPPDATA%\cmjLimit\cmjLimit.ini
;   全机共享： C:\ProgramData\cmjLimit\cmjLimit.ini   （集中管理，对所有用户生效）
;
; [users] 每行一个账户： 用户名 = 每天允许使用的时长
;   时长写法： 1h / 1h30m / 90m / 1.5h / 1:30 / 90（纯数字=分钟）
;   未列出的账户不会被监控（除非在 [sys] 里设置了 defaultuser）。

[users]
; 默认限制 guest 用户，每天 1 小时
guest=1h

[sys]
; 提前多少分钟弹窗提醒
warn=5m
; 当天用完后再次登录的宽限时长
grace=5m
; 悬浮窗位置： TopRight / TopLeft / BottomRight / BottomLeft
position=TopRight
; 整体不透明度 0~1（越小越透）
opacity=0.82
; 悬浮窗字号（磅）
hudfont=13
; 锁屏时是否暂停计时
pauselocked=true
